{% comment %}
  Google AdSense 広告ユニット（レスポンシブ）
  使用方法: {% include adsense-unit.html slot=site.adsense.slot_top %}
  ※ _config.yml の adsense.slot_* にAdSense管理画面で取得したIDを設定してください
{% endcomment %}
<div class="adsense-wrap" style="text-align:center;margin:1.5rem auto;overflow:hidden;max-width:100%;">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-6743751614716161"
       data-ad-slot="{{ include.slot | default: '0000000000' }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

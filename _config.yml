title: auto-ai-blog
author:
  name: auto-ai-blog Team
  # email: garyohosu@gmail.com  # 内部処理用のみ、フッターには表示されない
description: >-
  AI-Powered Content Generation Platform.
  Autonomous multi-agent system creating high-quality blog content.
url: "https://garyohosu.github.io"
baseurl: "/auto-ai-blog"
theme: minima
plugins:
  - jekyll-feed

# Google Analytics 4 (GA4)
# 測定ID: G-XXXXXXXXXX（実際のIDに置き換える）
google_analytics: G-BQSGHXV4T5

# Google AdSense（自動広告）
# _includes/custom-head.html に Auto Ads + GA4 スクリプト済み。
# AdSense管理画面 → 広告 → サイトごと → 「自動広告」を ON にすること。

# Jekyll ビルドから除外するファイル・ディレクトリ
exclude:
  # エージェントシステム
  - ve/
  - instructions/
  
  # ドキュメント
  - spec.md
  - AGENTS.md
  - VERIFICATION_PLAN.md
  - SAKURA_CRON_SETUP.md
  - PAGEVIEW_SYSTEM.md
  - LAYOUT_OVERRIDE_GUIDE.md
  - README.md
  # 注意: "*.md" は index.md も除外してしまうため使用しない
  
  # 開発・ビルドファイル
  - Gemfile
  - Gemfile.lock
  - "*.sh"
  - .gitignore
  - .git/
  - .github/
  - node_modules/
  - package.json
  - package-lock.json
  
  # その他
  - nul

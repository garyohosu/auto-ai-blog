name: Daily Virtual Employee Run

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-virtual-employee]
  schedule:
    - cron: "0 22 * * 0-4" # UTC Sun-Thu 22:00 = JST Mon-Fri 07:00（朝）
    - cron: "0 11 * * 1-5" # UTC Mon-Fri 11:00 = JST Mon-Fri 20:00（夜・ゴールデンタイム）
    - cron: "0 1 * * 0,6"  # UTC Sat-Sun 01:00 = JST Sat-Sun 10:00（朝）
    - cron: "0 6 * * 0,6"  # UTC Sat-Sun 06:00 = JST Sat-Sun 15:00（昼）
    - cron: "0 12 * * 0,6" # UTC Sat-Sun 12:00 = JST Sat-Sun 21:00（夜）

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run virtual employee
        env:
          TZ: Asia/Tokyo
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node ve/orchestrator.js

      - name: Commit & Push changes
        run: |
          git config user.name "virtual-employee-bot"
          git config user.email "virtual-employee-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ve: daily run $(date -u +%F)"
          git push
